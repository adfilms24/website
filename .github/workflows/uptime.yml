name: Uptime

# Prüft alle 15 Minuten, ob Website, CRM und Kundenportal erreichbar sind.
# Schlägt ein Lauf fehl, schickt GitHub eine E-Mail (Einstellung: Settings → Notifications → Actions).
# Läuft in diesem öffentlichen Repo, weil Actions-Minuten hier kostenlos sind.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Seiten erreichbar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: URLs prüfen
        run: |
          failed=0
          for url in \
            https://www.adfilms24.ch/ \
            https://www.adfilms24.ch/en/ \
            https://crm.adfilms24.ch/login \
            https://portal.adfilms24.ch/ ; do
            # Zweiter Versuch nach 20 s, damit ein kurzer Aussetzer keinen Alarm auslöst
            for attempt in 1 2; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 20 "$url" || echo 000)
              [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && break
              [ "$attempt" = 1 ] && sleep 20
            done
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "OK    $code  $url"
            else
              echo "::error::$url antwortet mit $code"
              failed=1
            fi
          done
          exit $failed
